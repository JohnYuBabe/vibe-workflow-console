services:
  mysql:
    image: mysql:8.0
    container_name: vibe-console-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vibe_console}
      MYSQL_USER: ${MYSQL_USER:-vibe}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vibe}
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: vibe-console-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER:-vibe}:${MYSQL_PASSWORD:-vibe}@mysql:3306/${MYSQL_DATABASE:-vibe_console}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SEED_ON_START: ${SEED_ON_START:-true}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3010:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_BASE: ${VITE_BASE:-/}
        VITE_API_BASE: /api
    container_name: vibe-console-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  mysql-data:
