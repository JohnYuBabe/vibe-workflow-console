# 域名子路径部署模板（示例：https://johnyu.wancafu.com/console/）
#
# 构建时把 base 和 api 都指到子路径：
#   VITE_BASE=/console/  VITE_API_BASE=/console/api  pnpm --filter @vibe/web build
# 然后：
#   rsync -a apps/web/dist/ server:/var/www/console/
#
# 若改为独立子域（console.example.com），把两个 location 换成：
#   location / { root /var/www/console; try_files $uri $uri/ /index.html; }
#   location /api/ { proxy_pass http://127.0.0.1:3010/api/; }
# 并把 VITE_BASE 设为 /、VITE_API_BASE 设为 /api。

server {
    listen 80;
    server_name johnyu.wancafu.com;
    # 启用 HTTPS 后由 certbot 改写这一段

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 前端静态文件
    location /console/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /console/index.html;
    }

    location /console/assets/ {
        root /var/www;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端 API：剥掉 /console 前缀，保留 /api
    location /console/api/ {
        proxy_pass http://127.0.0.1:3010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location = /console/healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
