# johnyu.wancafu.com —— 子路径部署（https://johnyu.wancafu.com/console/）
#
# 应用位置：
#   /var/www/console/            前端静态文件（apps/web/dist 的内容）
#   127.0.0.1:3010               NestJS 容器（docker compose 只绑回环）
#
# 证书路径沿用宝塔面板申请好 Let's Encrypt 时生成的文件；
# 续期由面板任务原地更新这两个文件，路径不变即可继续生效。
#
# 安装：
#   cp deploy/nginx.conf /www/server/panel/vhost/nginx/johnyu.wancafu.com.conf
#   nginx -t && nginx -s reload
# 面板里该站点的「SSL」保持开启，避免续期任务被关掉。

# server_tokens 由宝塔的全局 nginx.conf 统一下发；自建 nginx 时可在 http 里加
# server_tokens off;（同一上下文重复写会报 duplicate directive）

server {
    listen 80;
    listen [::]:80;
    server_name johnyu.wancafu.com;

    # 证书申请/续期的 HTTP-01 校验路径
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/johnyu.wancafu.com;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name johnyu.wancafu.com;

    ssl_certificate     /www/server/panel/vhost/cert/johnyu.wancafu.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/johnyu.wancafu.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头。注意：只要某个 location 里再写 add_header，这里的会全部失效，
    # 所以下面各 location 只用 expires，不用 add_header。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    access_log /www/wwwlogs/johnyu.wancafu.com.log;
    error_log  /www/wwwlogs/johnyu.wancafu.com.error.log;

    # 根路径直接进控制台
    location = / {
        return 302 /console/;
    }

    # 缺少结尾斜杠会导致相对资源解析错误，补一个 301
    location = /console {
        return 301 /console/;
    }

    # 浏览器仍会绕过页面里的 icon link 直接请求根路径 favicon
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # 健康检查：走真实 API（含数据库 ping），不是静态 ok
    location = /console/healthz {
        access_log off;
        proxy_pass http://127.0.0.1:3010/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # 后端 API：剥掉 /console 前缀，保留 /api
    location /console/api/ {
        proxy_pass http://127.0.0.1:3010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 带内容哈希的静态资源长缓存
    location /console/assets/ {
        root /var/www;
        expires 30d;
        try_files $uri =404;
    }

    # 入口 HTML 不缓存，保证发版后立刻拿到新的资源引用
    location = /console/index.html {
        root /var/www;
        expires -1;
    }

    # SPA 路由回退
    location /console/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /console/index.html;
    }

    # 未配置的路径不暴露默认站点内容
    location / {
        return 404;
    }
}
